[package]
name = "doremi-provider-live-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Bounded, explicit-ID Commons provider experiment, separate from the app"

[dependencies]
doremi-core = { path = "../../crates/doremi-core" }
doremi-player = { path = "../../crates/doremi-player", features = ["ogg-vorbis"] }
serde_json = "1"
# Existing locked HTTPS transport, used only by this experimental worker tool.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# Verify the published hash of the two explicitly authorized CC0 test files.
sha1 = "0.10"
# Pin verification of the official extractor zipapp, without loading user plugins.
sha2 = "0.10"
