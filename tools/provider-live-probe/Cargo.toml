[package]
name = "doremi-provider-live-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Bounded, explicit-ID Commons provider experiment, separate from the app"

[dependencies]
doremi-core = { path = "../../crates/doremi-core" }
doremi-commons = { path = "../../crates/doremi-commons" }
doremi-player = { path = "../../crates/doremi-player", features = ["ogg-vorbis"] }
serde_json = "1"
# Existing locked runtime; this CLI drives the same async adapter as a host worker.
tokio = { version = "1", features = ["rt", "time", "net"] }
# Pin verification of the official extractor zipapp, without loading user plugins.
sha2 = "0.10"
