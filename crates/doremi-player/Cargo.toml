[package]
name = "doremi-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Bounded local PCM decoding and native output for Doremi"

[features]
default = []
native-output = ["dep:cpal"]

[dependencies]
doremi-core = { path = "../doremi-core" }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuse the pinned native backend, preferring the desktop's normal audio host.
# Optional so the decoder/clock tests stay lightweight on low-memory machines.
cpal = { version = "0.18.2", optional = true, default-features = false, features = ["pipewire", "pulseaudio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { version = "0.18.2", optional = true, default-features = false }
