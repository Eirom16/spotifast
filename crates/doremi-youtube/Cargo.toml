[package]
name = "doremi-youtube"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
doremi-core = { path = "../doremi-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
# Only preprocess_player is called. Upstream needs one provider feature to
# avoid an empty-enum compiler error; no external provider is instantiated.
ytdlp-ejs = { version = "=0.1.1", default-features = false, features = ["external"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
swc_common = "=18.0.1"
swc_ecma_ast = "=19.0.0"
swc_ecma_parser = "=32.0.0"
swc_ecma_codegen = "=21.0.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tempfile = "3"
keyring-core = "1"
getrandom = "0.3"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials"] }
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
