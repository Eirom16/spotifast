[package]
name = "doremi-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doremi-core = { path = "../doremi-core" }
# Reuse the workspace's pinned UI, without any Spotifast integration.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "android-game-activity", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode the original logo once at startup, before drawing.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "android")'.dependencies]
# Select the same GameActivity bridge used by eframe and expose AndroidApp.
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
android_logger = "0.15"
log = "0.4"
