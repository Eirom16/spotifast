[package]
name = "doremi-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doremi-core = { path = "../doremi-core" }
doremi-library = { path = "../doremi-library" }
# Local PCM worker/output, separate from the neutral queue and Spotify engine.
doremi-player = { path = "../doremi-player", features = ["native-output"] }
# Host supplies explicit shuffle permutations; the deterministic core owns order.
rand = "0.9"
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode the original logo once at startup, before drawing.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux Commons experiment; Android keeps offline sources until its port is tested.
doremi-commons = { path = "../doremi-commons" }
doremi-player = { path = "../doremi-player", features = ["native-output", "ogg-vorbis"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Preserve the pinned eframe desktop host. Android owns EGL via GLSurfaceView
# because the pinned winit/GameActivity loop cannot survive Activity recreation.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
# Use the existing pinned renderer directly, without another Android event loop.
egui_glow = { version = "0.36.2", default-features = false }
# JNI carries only EGL lifecycle, touch and Android's Unicode InputConnection.
jni = "0.21"
# CPAL/AAudio needs a process-lifetime application context, initialized once.
ndk-context = "0.1"
android_logger = "0.15"
log = "0.4"
