[package]
name = "doremi-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
theme-files = ["dep:fastframe-theme"]

[dependencies]
egui = { version = "0.36.2", default-features = false, features = ["serde"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["image", "svg"] }
serde = { version = "1", features = ["derive"] }
# Reuse the exact inherited sources/revision already frozen in Cargo.lock.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.15.2" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.15.2" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.15.2", optional = true }
