# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  request_changes_workflow: true
  pre_merge_checks:
    custom_checks:
      - name: Review evidence stays out of the repository
        mode: error
        instructions: >-
          Fail when the pull request adds screenshots, captures, comparison
          pages, recordings, or other files made to show reviewers the change,
          such as a folder of before-and-after images or an HTML comparison
          page. That evidence belongs in the pull request description or
          comments. Media the project itself uses, such as a documentation
          figure a page shows, a release-note image, or an app asset, is
          fine. Pass when the pull request adds no review evidence.
      - name: Frozen baseline dependencies and reviewed source changes
        mode: error
        instructions: >-
          Follow Doremi CONTRIBUTING.md, not upstream account-wide policy.
          Prefer crates.io. Existing crmne git sources are inherited and frozen
          in F0, not repositories owned by Doremi. Flag every added or changed
          git source unless the Doremi maintainer explicitly approved its
          immutable pin, license and platform implications.
      - name: No new settings without approval
        mode: error
        instructions: >-
          Fail when the pull request adds a user setting, such as a new field
          in a Settings struct in src/settings.rs, a toggle, a slider, or an
          option in the Settings view, unless the linked issue shows the
          Doremi maintainer approving that setting or the pull request has
          the setting-approved label. The project prefers a good default, a
          keyboard shortcut, or a command; see Settings in CONTRIBUTING.md.
          Pass when the pull request adds no setting.
