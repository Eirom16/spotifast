plugins { id 'com.android.application' }
android {
    namespace 'dev.eirom.doremi'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    // All generated output stays inside the checkout's managed target.
    layout.buildDirectory = file('../../target/android-gradle/app')
    defaultConfig {
        applicationId 'dev.eirom.doremi.dev'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'dev.eirom.doremi.DoremiInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    sourceSets.main.jniLibs.srcDirs = ['../../target/android-jni']
    sourceSets.main.assets.srcDirs = ['../../target/android-assets']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile file('../development.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { debuggable true; jniDebuggable true } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    // Align Kotlin runtime transitives from AndroidX and GameActivity.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // Must match android-activity 0.6.1's bundled C++ bridge. No prefab glue.
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
