name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Doremi F0 still runs the preserved Spotifast baseline, not a yt-dlp player.
        Identify your commit and command. For that legacy executable, logs are:

        - Linux: `~/.local/state/spotifast/spotifast.log`
        - macOS: `~/Library/Application\ Support/me.paolino.spotifast/spotifast.log`
        - Windows: `%LOCALAPPDATA%\paolino\spotifast\data\spotifast.log`

        If the app crashed or vanished, include `panic.log` from the same folder.
        Remove tokens, cookies, signed media URLs and personal information before posting.
  - type: input
    id: version
    attributes:
      label: Version, commit, executable and installation method
      placeholder: "F0 source checkout, commit SHA, cargo run command"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Android (experimental, identify the build)
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "Arch, Hyprland, PipeWire / macOS 15.6 / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan (legacy baseline only)
      options:
        - Not applicable
        - Premium
        - Free
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted log or failing command output
      description: Include the relevant failure, without credentials or private URLs. Legacy log paths are above.
      render: text
    validations:
      required: false
