name: Doremi F0 validation

on:
  push:
    branches: [main, "chore/doremi-f0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doremi-f0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Native build and packaging test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libpipewire-0.3-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev \
            cmake ninja-build libclang-dev ruby dbus
      - uses: Swatinem/rust-cache@v2
      - name: Policy and packaging regressions
        run: |
          python3 scripts/test-f0.py
          python3 scripts/audit-dependencies.py --check
          python3 .github/scripts/check-dependency-sources.py
          python3 .github/scripts/check-review-evidence.py
          python3 .github/scripts/test-policy-checks.py
          python3 packaging/test-launchers.py
          python3 packaging/test-release-names.py
          python3 packaging/flatpak/test-metainfo.py
      - name: Format, lint and test the preserved application and core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --doc
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Build a validation payload, not a release
        run: |
          cargo build --locked -p spotifast --bin spotifast
          mkdir -p target/validation
          cp target/debug/spotifast target/validation/
          cp LICENSE target/validation/
          python3 scripts/build-manifest.py --target x86_64-unknown-linux-gnu \
            --kind legacy-desktop --payload target/validation/spotifast --output target/validation/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ github.sha }}
          path: target/validation/
          if-no-files-found: error
          retention-days: 7

  android-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pinned toolchain and portable target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # No NDK/linker needed for this Rust-only rlib. This is NOT an APK build.
      - name: Test on host, then cross-compile the neutral core
        run: |
          cargo test --locked -p doremi-core
          cargo build --locked -p doremi-core --target aarch64-linux-android
          mkdir -p target/validation
          cp target/aarch64-linux-android/debug/libdoremi_core.rlib target/validation/
          cp LICENSE target/validation/
          python3 scripts/build-manifest.py --target aarch64-linux-android \
            --kind core-rlib-not-apk --payload target/validation/libdoremi_core.rlib \
            --output target/validation/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: android-core-not-apk-${{ github.sha }}
          path: target/validation/
          if-no-files-found: error
          retention-days: 7

  verified-pair:
    needs: [linux, android-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-${{ github.sha }}"
          path: target/validation-artifacts
      - name: Verify source, version, kind and hashes before grouping artifacts
        run: python3 scripts/verify-artifacts.py target/validation-artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: verified-f0-${{ github.sha }}
          path: target/validation-artifacts/
          if-no-files-found: error
          retention-days: 7
