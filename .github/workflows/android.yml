name: Doremi Android development

on:
  push:
    branches: ["feature/doremi-android-real"]
    paths: ["crates/doremi-app/**", "crates/doremi-core/**", "android/**", "Cargo.toml", "Cargo.lock", "scripts/build-android.sh", "scripts/verify-android.py", "scripts/android-native-identity.py", "scripts/native-qa.py", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      native_run:
        description: Prior CI run, only for identical Rust inputs
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: doremi-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOREMI_NATIVE_RUN: ${{ inputs.native_run }}
  GH_TOKEN: ${{ github.token }}
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUSTUP_HOME: ${{ github.workspace }}/target/rustup

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/android-cargo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: rustup show active-toolchain
      - name: Build both Android ABIs, test APK and verify packaging
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-android-native-${{ github.sha }}
          path: target/android-jni/
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-android-dev-${{ github.sha }}
          path: target/android-dist/
          if-no-files-found: error
          retention-days: 7

  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/native-cargo
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - name: Native UI libraries and isolated graphical QA
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev xvfb xauth xdotool imagemagick
      - name: Host tests and lint, without the Spotifast dependency tree
        run: |
          cargo fmt --all --check
          cargo test --locked -p doremi-app --all-targets
          cargo clippy --locked -p doremi-app --all-targets -- -D warnings
          cargo build --locked -p doremi-app --bin doremi-app
      - name: Real X11 navigation, keyboard and queue sequence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' python3 scripts/native-qa.py target/native-cargo/debug/doremi-app target/native-qa
          mkdir -p target/native-dist
          cp target/native-cargo/debug/doremi-app target/native-dist/
          cp LICENSE target/native-dist/
          git rev-parse HEAD > target/native-dist/SOURCE_COMMIT
          cd target/native-dist
          sha256sum doremi-app LICENSE SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-native-linux-${{ github.sha }}
          path: |
            target/native-dist/
            target/native-qa/
          if-no-files-found: error
          retention-days: 7
