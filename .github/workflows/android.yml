name: Doremi Android development

on:
  push:
    branches: ["feature/doremi-android-real", "feature/doremi-product-ui"]
    paths: ["crates/doremi-youtube/**", "crates/doremi-musicbrainz/**", "crates/doremi-ui/**", "assets/icons/**", "crates/doremi-app/**", "crates/doremi-core/**", "crates/doremi-library/**", "crates/doremi-player/**", "crates/doremi-commons/**", "assets/audio/**", "android/**", "Cargo.toml", "Cargo.lock", "scripts/build-android.sh", "scripts/verify-android.py", "scripts/android-native-identity.py", "scripts/native-qa.py", "scripts/native-manifest.py", "scripts/windows-native-smoke.ps1", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      native_run:
        description: Prior CI run, only for identical Rust inputs
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: doremi-android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOREMI_NATIVE_RUN: ${{ inputs.native_run }}
  GH_TOKEN: ${{ github.token }}
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUSTUP_HOME: ${{ github.workspace }}/target/rustup

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/android-cargo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: rustup show active-toolchain
      - name: Require successful native gates before reusing identical Rust
        if: env.DOREMI_NATIVE_RUN != ''
        run: |
          mkdir -p target
          gh run view "$DOREMI_NATIVE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs > target/reused-native-gates.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          data=json.loads(Path('target/reused-native-gates.json').read_text())
          assert data['status']=='completed' and data['conclusion']=='success'
          jobs={job['name']:job['conclusion'] for job in data['jobs']}
          assert jobs.get('android-apk')=='success' and jobs.get('native-host')=='success'
          PYCODE
      - name: Build both Android ABIs, test APK and verify packaging
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-android-native-${{ github.sha }}
          path: target/android-jni/
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-android-dev-${{ github.sha }}
          path: target/android-dist/
          if-no-files-found: error
          retention-days: 7

  native-host:
    # Java-only APK iterations reuse a successful host gate; the Android job
    # independently rejects every Rust input difference before packaging.
    if: ${{ !inputs.native_run }}
    runs-on: ubuntu-24.04
    # The prior run spent its entire 20-minute budget downloading native libraries.
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/native-cargo
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - name: Native UI libraries and isolated graphical QA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev libasound2-dev libpipewire-0.3-dev libclang-dev xvfb xauth xdotool imagemagick zenity
      - name: Host tests and lint, without the Spotifast dependency tree
        run: |
          cargo fmt --all --check
          cargo test --locked -p doremi-library --all-targets
          cargo test --locked -p doremi-commons --all-targets
          cargo clippy --locked -p doremi-commons --all-targets -- -D warnings
          cargo clippy --locked -p doremi-library --all-targets -- -D warnings
          cargo test --locked -p doremi-youtube --all-targets
          cargo clippy --locked -p doremi-youtube --all-targets -- -D warnings
          cargo test --locked -p doremi-musicbrainz --all-targets
          cargo test --locked -p doremi-app --all-targets
          cargo test --locked -p doremi-player --features native-output,ogg-vorbis,local-flac,local-mp3,aac-mp4 --all-targets
          cargo clippy --locked -p doremi-player --features native-output,ogg-vorbis,local-flac,local-mp3,aac-mp4 --all-targets -- -D warnings
          cargo clippy --locked -p doremi-app --all-targets -- -D warnings
          cargo build --locked -p doremi-app --bins
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p doremi-library -p doremi-commons -p doremi-player -p doremi-app --no-deps
      - name: Real X11 navigation, keyboard and queue sequence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p target/native-dist
          cp target/native-cargo/debug/doremi target/native-dist/
          cp target/native-cargo/debug/doremi-app target/native-dist/
          cp LICENSE Cargo.lock target/native-dist/
          mkdir -p target/native-dist/licenses
          cp assets/doremi/LICENSE target/native-dist/licenses/Doremi-assets-GPL-3.txt
          cp assets/fonts/Inter-LICENSE.txt assets/icons/LICENSE.txt target/native-dist/licenses/
          cp assets/doremi/PROVENANCE.md target/native-dist/licenses/
          cp assets/audio/LICENSE.txt target/native-dist/licenses/Audio-CC0.txt
          cp assets/audio/manifest.json target/native-dist/licenses/Audio-manifest.json
          cp tools/provider-live-probe/corpus.json target/native-dist/licenses/Commons-CC0-corpus.json
          cp crates/doremi-commons/music-corpus.json target/native-dist/licenses/Commons-CC0-music-corpus.json
          cp crates/doremi-youtube/LICENSE-TUBEFAST target/native-dist/licenses/Tubefast-MIT.txt
          cp crates/doremi-player/licenses/* target/native-dist/licenses/
          cp crates/doremi-player/tests/fixtures/SOURCE.md target/native-dist/licenses/Symphonia-source-and-fixture.md
          python3 scripts/native-manifest.py target/native-dist/doremi target/native-dist/manifest.json
          git rev-parse HEAD > target/native-dist/SOURCE_COMMIT
          (
            cd target/native-dist
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          xvfb-run -a -s '-screen 0 1440x1000x24' python3 scripts/native-qa.py target/native-cargo/debug/doremi-app target/native-qa
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-native-linux-${{ github.sha }}
          path: |
            target/native-dist/
            target/native-qa/
          if-no-files-found: error
          retention-days: 7

  windows-host:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/native-cargo
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: rustup show active-toolchain
      - name: Test and build the new Doremi host natively
        shell: pwsh
        run: |
          cargo test --locked -p doremi-library -p doremi-commons --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p doremi-library -p doremi-commons --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p doremi-youtube --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p doremi-youtube --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p doremi-musicbrainz --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p doremi-app --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p doremi-player --features native-output,ogg-vorbis,local-flac,local-mp3,aac-mp4 --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p doremi-player --features native-output,ogg-vorbis,local-flac,local-mp3,aac-mp4 --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p doremi-app --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p doremi-app --bin doremi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/native-dist/licenses | Out-Null
          Copy-Item target/native-cargo/debug/doremi.exe, LICENSE, Cargo.lock target/native-dist/
          Copy-Item assets/doremi/LICENSE target/native-dist/licenses/Doremi-assets-GPL-3.txt
          Copy-Item assets/doremi/PROVENANCE.md, assets/fonts/Inter-LICENSE.txt, assets/icons/LICENSE.txt target/native-dist/licenses/
          Copy-Item assets/audio/LICENSE.txt target/native-dist/licenses/Audio-CC0.txt
          Copy-Item assets/audio/manifest.json target/native-dist/licenses/Audio-manifest.json
          Copy-Item tools/provider-live-probe/corpus.json target/native-dist/licenses/Commons-CC0-corpus.json
          Copy-Item crates/doremi-commons/music-corpus.json target/native-dist/licenses/Commons-CC0-music-corpus.json
          Copy-Item crates/doremi-player/tests/fixtures/SOURCE.md target/native-dist/licenses/Symphonia-source-and-fixture.md
          Copy-Item crates/doremi-youtube/LICENSE-TUBEFAST target/native-dist/licenses/Tubefast-MIT.txt
          Copy-Item crates/doremi-player/licenses/* target/native-dist/licenses/
          & target/native-dist/doremi.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash target/native-dist/doremi.exe -Algorithm SHA256 | Format-List | Out-File target/native-dist/SHA256.txt
          & ./scripts/windows-native-smoke.ps1 -Binary target/native-dist/doremi.exe -Output target/native-dist/smoke
          if (!$?) { exit 1 }
          python scripts/native-manifest.py target/native-dist/doremi.exe target/native-dist/manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Native CLI/tests/build only. A runner without an audio device does
          # not prove playback on physical Windows hardware.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doremi-native-windows-${{ github.sha }}
          path: target/native-dist/
          if-no-files-found: error
          retention-days: 7
